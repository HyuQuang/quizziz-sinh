<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="dna1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dna2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Base pair rungs -->
  <line x1="42" y1="36" x2="86" y2="36" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="42" cy="36" r="4" fill="#10b981" />
  <circle cx="86" cy="36" r="4" fill="#38bdf8" />

  <line x1="48" y1="52" x2="80" y2="52" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="48" cy="52" r="4" fill="#10b981" />
  <circle cx="80" cy="52" r="4" fill="#38bdf8" />

  <line x1="60" y1="64" x2="68" y2="64" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="64" cy="64" r="3.5" fill="#a7f3d0" />

  <line x1="48" y1="76" x2="80" y2="76" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="48" cy="76" r="4" fill="#38bdf8" />
  <circle cx="80" cy="76" r="4" fill="#10b981" />

  <line x1="42" y1="92" x2="86" y2="92" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="42" cy="92" r="4" fill="#38bdf8" />
  <circle cx="86" cy="92" r="4" fill="#10b981" />

  <!-- DNA Strands Helix Waves -->
  <path d="M42,24 C42,48 86,52 86,64 C86,76 42,80 42,104" fill="none" stroke="url(#dna1)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M86,24 C86,48 42,52 42,64 C42,76 86,80 86,104" fill="none" stroke="url(#dna2)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
</svg>
